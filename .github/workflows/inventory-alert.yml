name: Low Stock Inventory Check

on:
  schedule:
    # Daily at 9am US/Eastern (13:00/14:00 UTC depending on DST) — Netlify build clock
    # doesn't matter here, this just needs to land once during business hours.
    - cron: '0 13 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3

      - name: Check inventory and alert on low stock
        env:
          VITE_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
          ALERT_FUNCTION_URL: https://hellboundsauces.com/.netlify/functions/send-email
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: node scripts/check-inventory.js

      - name: Commit updated inventory state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/inventory-state.json

          if git diff --staged --quiet; then
            echo "No inventory state changes"
          else
            git commit -m "chore: update inventory state [skip ci]"
            git push
          fi
